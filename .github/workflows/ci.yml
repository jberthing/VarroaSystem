name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev libnss3 libxss1 libxtst6 xauth xvfb
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test -- --run --reporter=verbose
      env:
        CI: true
      
    - name: Build
      run: npm run build
