<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#fbbf24" rx="64"/>
  
  <!-- Honeycomb pattern -->
  <g opacity="0.2">
    <path d="M256 100 L300 125 L300 175 L256 200 L212 175 L212 125 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <path d="M212 225 L256 250 L256 300 L212 325 L168 300 L168 250 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <path d="M300 225 L344 250 L344 300 L300 325 L256 300 L256 250 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  </g>
  
  <!-- Bee body (simplified) -->
  <g transform="translate(256, 280)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="#1f2937"/>
    
    <!-- Stripes -->
    <rect x="-60" y="-30" width="120" height="20" fill="#fbbf24"/>
    <rect x="-60" y="10" width="120" height="20" fill="#fbbf24"/>
    
    <!-- Wings -->
    <ellipse cx="-40" cy="-20" rx="35" ry="50" fill="white" opacity="0.7" transform="rotate(-30 -40 -20)"/>
    <ellipse cx="40" cy="-20" rx="35" ry="50" fill="white" opacity="0.7" transform="rotate(30 40 -20)"/>
    
    <!-- Head -->
    <circle cx="0" cy="-90" r="35" fill="#1f2937"/>
    
    <!-- Antennae -->
    <line x1="-15" y1="-110" x2="-25" y2="-130" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="-110" x2="25" y2="-130" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-25" cy="-130" r="5" fill="#1f2937"/>
    <circle cx="25" cy="-130" r="5" fill="#1f2937"/>
  </g>
  
  <!-- Letter V (for Varroa) -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1f2937" text-anchor="middle">V</text>
</svg>
